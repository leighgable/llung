<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#4CAF50",
              "background-light": "#F8F9FA",
              "background-dark": "#102217",
              "surface-light": "#FFFFFF",
              "surface-dark": "#1C3124",
              "text-light": "#333333",
              "text-dark": "#E0E0E0",
              "text-subtle-light": "#666666",
              "text-subtle-dark": "#A0A0A0",
              "border-light": "#E0E0E0",
              "border-dark": "#334A3E",
              "accent": "#FFC107"
            },
            fontFamily: {
              "display": ["Epilogue", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<span class="material-symbols-outlined text-text-light dark:text-text-dark text-3xl">arrow_back</span>
<h1 class="text-xl font-bold leading-tight tracking-tight flex-1 text-center">Profile</h1>
<div class="w-8"></div> <!-- Spacer for balance -->
</div>
<!-- Tabs -->
<div class="pb-3 overflow-x-auto">
<div class="flex border-b border-border-light dark:border-border-dark px-4 gap-6">
<a class="flex shrink-0 flex-col items-center justify-center border-b-[3px] border-b-primary text-text-light dark:text-text-dark pb-[13px] pt-4" href="#">
<p class="text-sm font-bold leading-normal">Account Settings</p>
</a>
<a class="flex shrink-0 flex-col items-center justify-center border-b-[3px] border-b-transparent text-text-subtle-light dark:text-text-subtle-dark pb-[13px] pt-4" href="#">
<p class="text-sm font-medium leading-normal">Preferences</p>
</a>
<a class="flex shrink-0 flex-col items-center justify-center border-b-[3px] border-b-transparent text-text-subtle-light dark:text-text-subtle-dark pb-[13px] pt-4" href="#">
<p class="text-sm font-medium leading-normal">Feedback</p>
</a>
<a class="flex shrink-0 flex-col items-center justify-center border-b-[3px] border-b-transparent text-text-subtle-light dark:text-text-subtle-dark pb-[13px] pt-4" href="#">
<p class="text-sm font-medium leading-normal">Help Center</p>
</a>
</div>
</div>
<!-- Main Content Area -->
<main class="flex-1 p-4 space-y-6">
<!-- Section: Account Settings -->
<div class="space-y-4">
<label class="flex flex-col w-full">
<p class="text-base font-medium leading-normal pb-2 text-text-light dark:text-text-dark">Username</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-text-light dark:text-text-dark placeholder:text-text-subtle-light dark:placeholder:text-text-subtle-dark h-14 p-[15px] text-base font-normal leading-normal focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="jane.doe" value="jane.doe"/>
</label>
<label class="flex flex-col w-full">
<p class="text-base font-medium leading-normal pb-2 text-text-light dark:text-text-dark">Email</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-text-light dark:text-text-dark placeholder:text-text-subtle-light dark:placeholder:text-text-subtle-dark h-14 p-[15px] text-base font-normal leading-normal focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="jane.doe@example.com" value="jane.doe@example.com"/>
</label>
<label class="flex flex-col w-full">
<p class="text-base font-medium leading-normal pb-2 text-text-light dark:text-text-dark">Phone Number</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-text-light dark:text-text-dark placeholder:text-text-subtle-light dark:placeholder:text-text-subtle-dark h-14 p-[15px] text-base font-normal leading-normal focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary" placeholder="+1 (555) 123-4567" value="+1 (555) 123-4567"/>
</label>
<a class="text-primary font-bold text-sm text-center block pt-2" href="#">Change Password</a>
<!-- MFA Toggle Switch -->
<div class="flex items-center justify-between p-4 bg-surface-light dark:bg-surface-dark rounded-lg border border-border-light dark:border-border-dark">
<div>
<p class="font-bold text-text-light dark:text-text-dark">Enable Multi-Factor Authentication</p>
<p class="text-sm text-text-subtle-light dark:text-text-subtle-dark">Add an extra layer of security.</p>
</div>
<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-primary transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" role="switch">
<span aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 translate-x-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="space-y-4 pt-4">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl text-base hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark transition-colors">Save Changes</button>
<button class="w-full bg-transparent text-red-500 font-bold py-4 rounded-xl text-base border border-red-500 hover:bg-red-500/10 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-background-dark transition-colors">Log Out</button>
</div>
</main>
</div>
</body></html>
