<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Recognition Camera</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/htmx.org"></script>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#2bee79",
            "background-light": "#f6f8f7",
            "background-dark": "#102217",
          },
          fontFamily: {"display": ["Epilogue", "sans-serif"]},
        },
      },
    };
  </script>
  <style>
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .animate-spin {
      animation: spin 1s linear infinite;
    }
  </style>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }

    body {
      min-height: 100dvh;
      background: #000;
    }

    video,
    canvas,
    img.preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body class="font-display bg-background-dark">
  <div id="app"
    class="relative mx-auto flex h-screen max-h-[960px] w-full max-w-[480px] flex-col overflow-hidden bg-background-light dark:bg-background-dark"
    hx-target="this" hx-swap="outerHTML">

    <!-- Camera View -->
    <div id="camera-view" class="relative flex-grow bg-black/90 flex items-center justify-center">
      <video id="camera-stream" autoplay playsinline></video>
      <canvas id="capture-canvas" hidden></canvas>
      <p class="absolute bottom-4 text-white text-base text-center z-10">Center your dish here</p>
    </div>

    <!-- Capture Button -->
    <div class="absolute bottom-[100px] left-0 right-0 z-10 flex flex-col items-center gap-4">
      <button id="capture-btn"
        class="flex shrink-0 items-center justify-center rounded-full size-20 bg-primary text-background-dark border-4 border-background-light dark:border-background-dark shadow-lg">
        <span class="material-symbols-outlined fill text-5xl">photo_camera</span>
      </button>
    </div>
  </div>
  <!-- HTMX loading indicator (appears automatically on any hx-request) -->
  <div id="loading-indicator"
    class="fixed inset-0 bg-black/60 flex items-center justify-center text-white text-lg font-semibold z-50 hidden"
    hx-ext="indicator">
    <div class="animate-spin rounded-full h-16 w-16 border-4 border-primary border-t-transparent"></div>
  </div>

  <script>
    document.body.addEventListener("htmx:configRequest", () => {
      document.getElementById("loading-indicator").classList.remove("hidden");
    });
    document.body.addEventListener("htmx:afterSwap", () => {
      document.getElementById("loading-indicator").classList.add("hidden");
    });
    document.body.addEventListener("htmx:responseError", () => {
      document.getElementById("loading-indicator").classList.add("hidden");
      alert("⚠️ Something went wrong. Please try again.");
    });
  </script>
  <script>
    const video = document.getElementById('camera-stream');
    const canvas = document.getElementById('capture-canvas');
    const captureBtn = document.getElementById('capture-btn');
    let currentStream;

    // Start camera
    async function startCamera() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
        video.srcObject = currentStream;
      } catch (err) {
        console.error('Camera access error:', err);
      }
    }

    // Capture frame and show preview
    captureBtn.addEventListener('click', () => {
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Convert to dataURL
      const dataUrl = canvas.toDataURL('image/jpeg');

      // Stop camera stream
      currentStream.getTracks().forEach(track => track.stop());

      // Swap UI using HTMX
      htmx.ajax('POST', '/preview', {values: {photo_data: dataUrl}, target: '#app', swap: 'outerHTML'});
    });

    startCamera();
  </script>
</body>

</html>
