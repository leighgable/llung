<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Food App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2bee79",
              "background-light": "#f6f8f7",
              "background-dark": "#102217",
            },
            fontFamily: {
              "display": ["Epilogue", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden font-display" style='font-family: Epilogue, "Noto Sans", sans-serif;'>
<div class="flex flex-col items-center justify-center grow w-full max-w-md mx-auto p-6">
<!-- Logo -->
<div class="flex flex-col items-center gap-2 mb-8">
<div class="w-16 h-16 bg-primary/20 dark:bg-primary/30 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl">restaurant</span>
</div>
<h1 class="text-[#0d1b13] dark:text-background-light tracking-tight text-3xl font-bold leading-tight text-center">Let's get cooking!</h1>
</div>
<!-- Login Form -->
<div class="w-full flex flex-col gap-4">
<!-- Email/Username Field -->
<div class="flex flex-col w-full">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#0d1b13] dark:text-gray-300 text-base font-medium leading-normal pb-2">Email / Username</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b13] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter your email or username" value=""/>
</label>
</div>
<!-- Password Field -->
<div class="flex flex-col w-full">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#0d1b13] dark:text-gray-300 text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b13] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-gray-400 dark:text-gray-500 flex border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark items-center justify-center pr-[15px] rounded-r-lg border-l-0">
<span class="material-symbols-outlined text-2xl" data-icon="visibility">visibility</span>
</div>
</div>
</label>
</div>
<!-- Forgot Password Link -->
<div class="w-full text-right">
<p class="text-primary text-sm font-medium leading-normal underline cursor-pointer">Forgot Password?</p>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-4 mt-8">
<button class="flex items-center justify-center w-full bg-primary text-black dark:text-black text-base font-bold h-14 px-6 rounded-lg hover:bg-opacity-90 transition-colors">Login</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-gray-300 dark:border-gray-700"></div>
<span class="flex-shrink mx-4 text-gray-400 dark:text-gray-500 text-sm">or</span>
<div class="flex-grow border-t border-gray-300 dark:border-gray-700"></div>
</div>
<button class="flex items-center justify-center w-full bg-primary/20 dark:bg-primary/30 text-primary text-base font-bold h-14 px-6 rounded-lg hover:bg-opacity-80 transition-colors">Sign Up</button>
</div>
<!-- Social Logins (Optional) -->
<div class="w-full flex flex-col items-center mt-8 gap-4">
<p class="text-gray-500 dark:text-gray-400 text-sm">Continue with</p>
<div class="flex items-center justify-center gap-4">
<button class="w-12 h-12 flex items-center justify-center border border-gray-300 dark:border-gray-700 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<img alt="Google logo" class="h-6 w-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAVHQY3rNUpfL62X-JGgTm8nCE8gWLx0aydem825hn1UAlmd7AkpALLBDQPHck6xP24Tw-8DqShZQKe6Gxc6-yd7PGImmcPfIJP9l4P9G2bjgVR0TY5MPOjpiKL7Ol9Exe6cb7CUeXhekuB-Y8hF3UHAJYLlOwlRV1ZEK60QREypnIXXo316kg5_h2ociV6gTOWpZ8wIuZr2zC86oGwxLbCpQ-ps8lUaF077wNVjuBRTfGo5hNbYcWxWgo47Y4v25o944Dd56R69A"/>
</button>
<button class="w-12 h-12 flex items-center justify-center border border-gray-300 dark:border-gray-700 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<img alt="Apple logo" class="h-6 w-6 dark:invert" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHNFkWXJQNDwMjr9LPDJLV9kTdst32RI7uwCG3xOvFWkn3j2LUy6hPPoO2UMGgI1lCayTAgjzQtw3kthXdFsMt0SmCef-foPYw4qIZkT6-LOr_tfuxkfJPsbNEmrExkswsQH7eeOfh4Ezs0B8CtRIqcCNLzbqfIjOLcqc6t8ELxeYjY0IscdNJJqbI5P6Z15y4wl4_bKSBjhY3Xr-6x3SLIn8qSnN09oVlKMIPP77WjX0QfyiAUncFQPUM5LIQ1VG6UdGNT4b5cQ"/>
</button>
<button class="w-12 h-12 flex items-center justify-center border border-gray-300 dark:border-gray-700 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<img alt="Facebook logo" class="h-6 w-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1jcX6gv4MdzhM9YGOWg3cXQ3Gmm2-DdekATUyx03v2JLqhMoocEbuMR4OM8VlJEvysoqcfR1fPJZBVovK-rdN9bqFseK4ZrkkCM9-yOTm98yIL_ldUirJe3x0b8goDEX9k9zD1GZVUFOB9oQet7d6I0XLJcPkkAePjn9mWiAD4KqiKEP4bVzFkek4IGjsM9qmgbpI7jWMaH7pcyN6agYCfZ2RE0rL3Wtmf2zMlkhRz_8Wb-CItVCwsGIzjFt9iyBGl2dQ7NKROw"/>
</button>
</div>
</div>
</div>
</div>
</body></html>
