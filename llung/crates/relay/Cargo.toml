[package]
name = "relay"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.56.0", features = ["macros", "tokio", "gossipsub", "mdns", "noise", "tcp", "yamux", "quic", "kad", "relay", "dcutr", "identify", "dns", "ping", "request-response", "cbor"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
tracing = "0.1.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
dirs = "5"
futures = "0.3"
llung-core = { path = "../llung-core" }
