[package]
name = "sugi-tool"
version = "0.1.0"
edition = "2024"
description = "llung wasm tool: layered directed-graph layout (Sugiyama) returning node coordinates as a sug-v1 render document"

[lib]
# cdylib for the wasm component; rlib so `cargo test` can run the
# layout logic on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = "0.8"
rust-sugiyama = "0.4"
