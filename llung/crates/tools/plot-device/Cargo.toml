[package]
name = "plot-device-tool"
version = "0.1.0"
edition = "2024"
description = "llung wasm tool: plot tabular data (CSV) as braille scatter, histogram, or CDF"

[lib]
# cdylib for the wasm component; rlib so `cargo test` can run the
# parser/plot logic on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.63"
serde_json = "1"
