[package]
name = "artist-tool"
version = "0.1.0"
edition = "2024"
description = "llung wasm tool: procedural generated art as terminal braille, from a seed"

[lib]
# cdylib for the wasm component; rlib so `cargo test` can run the
# generator/rasterizer logic on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.63"
serde_json = "1"
