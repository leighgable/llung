[package]
name = "landscape-tool"
version = "0.1.0"
edition = "2024"
description = "llung wasm tool: render a 3D wireframe surface of f(x,y) as terminal braille art"

[lib]
# cdylib for the wasm component; rlib so `cargo test` can run the
# evaluator/rasterizer logic on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.63"
serde_json = "1"
