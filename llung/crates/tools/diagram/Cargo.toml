[package]
name = "diagram-tool"
version = "0.1.0"
edition = "2024"
description = "llung wasm tool: flowcharts and nested-box diagrams as terminal box-drawing art"

[lib]
# cdylib for the wasm component; rlib so `cargo test` can run the
# parser/layout logic on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.63"
serde_json = "1"
